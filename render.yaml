# Render blueprint: the api (Hono + run executor) and its Postgres. The web app is deployed on Vercel
# (apps/web) with NEXT_PUBLIC_API_URL pointing at this service.
# Deploy: Render dashboard → Blueprints → New → this repo. Then fill the `sync: false` secrets.
# Everything works with no secrets at all (mock PayPal + scripted agents); add them to go live.
services:
  - type: web
    name: swarm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@10.30.3 --activate && pnpm install --frozen-lockfile && pnpm --filter @swarm/db db:migrate
    startCommand: pnpm --filter @swarm/api start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: swarm-db
          property: connectionString
      - key: SWARM_KMS_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*" # tighten to the Vercel URL once you know it, e.g. https://paypal-swarm.vercel.app
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: swarm-api
          property: host
      - key: DEMO_DAILY_TOKEN_CAP
        value: "1500000"
      - key: SWARM_RUN_TOKEN_CAP
        value: "400000"
      - key: LLM_CACHE
        value: "0"
      - key: SWARM_MODEL_SHOPPER
        value: anthropic/claude-haiku-5.5
      - key: SWARM_MODEL_MERCHANT
        value: anthropic/claude-sonnet-5.5
      - key: SWARM_MODEL_ANALYST
        value: anthropic/claude-sonnet-5.5
      # --- secrets: set in the dashboard; leave empty to stay in mock / scripted mode ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: swarm-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
