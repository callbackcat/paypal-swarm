# Render blueprint: the api (Hono + run executor) and its Postgres. The web app is deployed on Vercel
# (apps/web) with NEXT_PUBLIC_API_URL pointing at this service.
# Deploy: Render dashboard → Blueprints → New → this repo. Then fill the `sync: false` secrets.
# Everything works with no secrets at all (mock PayPal + scripted agents); add them to go live.
services:
  - type: web
    name: swarm-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@10.30.3 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @swarm/db db:migrate
    startCommand: pnpm --filter @swarm/api start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: swarm-db
          property: connectionString
      - key: SWARM_KMS_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*" # tighten to the Vercel URL once you know it, e.g. https://paypal-swarm.vercel.app
      # The public URL comes from RENDER_EXTERNAL_URL, which Render sets on every web service.
      - key: DEMO_DAILY_TOKEN_CAP
        value: "1500000"
      - key: SWARM_RUN_TOKEN_CAP
        value: "400000"
      - key: LLM_CACHE
        value: "0"
      # The demo runs every agent on Haiku 5.5: that is how the README numbers were measured and it keeps a run at cents.
      # Switch the merchant and analyst to anthropic/claude-sonnet-5.5 for a stronger merchant at about 5x the cost.
      - key: SWARM_MODEL_SHOPPER
        value: anthropic/claude-haiku-5.5
      - key: SWARM_MODEL_MERCHANT
        value: anthropic/claude-haiku-5.5
      - key: SWARM_MODEL_ANALYST
        value: anthropic/claude-haiku-5.5
      # --- secrets: set in the dashboard; leave empty to stay in mock / scripted mode ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # The code a live run on the key above needs. Set it in the dashboard; unset turns the gate off.
      - key: SWARM_ACCESS_CODE
        sync: false

databases:
  - name: swarm-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
