name: keepalive

# Render's free instances sleep after 15 minutes without traffic and take 30-60 s to wake.
# A health ping every 10 minutes keeps the demo api warm during judging week.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.SWARM_API_URL || 'https://swarm-api.onrender.com' }}
        run: |
          code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 90 "$URL/healthz" || true)
          echo "$URL/healthz -> $code"
          cat /tmp/h.json 2>/dev/null || true
          test "$code" = "200"
